name: Native platform validation
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      upload_development_bundles:
        description: 'Also retain development ZIPs (release installers are always retained)'
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches: [main]
concurrency:
  group: rdatacraft-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y lzip
      - run: rustup update stable --no-self-update
      - run: python scripts/release_assets.py native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdatacraft-source-native
          path: artifacts/release-native-assets/*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdatacraft-native-notices
          path: |
            licenses/RELEASE-NATIVE-NOTICES.txt
            licenses/SOURCE-ACCESS.txt
          retention-days: 14
          if-no-files-found: error
  mac:
    needs: sources
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rdatacraft-native-notices
          path: licenses
      - name: Prepare Rust for the bundled AI service
        run: rustup update stable --no-self-update
      - run: python3 scripts/build_ai.py --test
      - run: python3 scripts/bootstrap.py --arch ${{ matrix.arch }} --runtime-root runtime
      - name: Exercise the bundled AI bridge without a real provider
        run: |
          python3 scripts/build_ai.py
          helper=$(find artifacts/ai-helper -name rdatacraft-ai -type f | head -1)
          python3 tests/ai_bridge.py --helper "$helper"
      - run: python3 scripts/test.py --require-node
      - run: ./scripts/rscript.sh scripts/collect_licenses.R
      - run: python3 scripts/fetch_sources.py
      - run: python3 scripts/fetch_native_sources.py
      - run: python3 scripts/build_desktop.py --arch ${{ matrix.arch }} --runtime-root runtime --zip
      - name: Package and exercise the read-only Mac installer
        run: |
          version=$(python3 -c 'import json; print(json.load(open("config/release.json"))["version"])')
          python3 scripts/package_installers.py --mac-app "dist/RDataCraft v${version}.app" --arch ${{ matrix.arch }}
          python3 scripts/test_macos_bundle.py --dmg "dist/RDataCraft-${version}-macos-${{ matrix.arch }}.dmg" --output artifacts/installed-mac --advisory-paste
          python3 scripts/release_assets.py platform --platform macos-${{ matrix.arch }} --installer "dist/RDataCraft-${version}-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdatacraft-release-macos-${{ matrix.arch }}
          path: artifacts/release-ready/macos-${{ matrix.arch }}/*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdatacraft-source-macos-${{ matrix.arch }}
          path: artifacts/release-source-parts/*
          retention-days: 14
          if-no-files-found: error
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdatacraft-validation-macos-${{ matrix.arch }}
          path: |
            artifacts/validation-*.json
            artifacts/v*-*.log
            dependencies.lock.json
            source-manifest.json
            artifacts/installed-mac/**/*.json
            artifacts/installed-mac/*.log
            artifacts/installed-mac/**/*.log
            artifacts/installed-mac/**/*.txt
            artifacts/installed-mac/**/*.png
          if-no-files-found: warn
      - name: Upload requested development bundle
        if: github.event_name == 'workflow_dispatch' && inputs.upload_development_bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdatacraft-macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.dmg
  windows:
    needs: sources
    timeout-minutes: 45
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rdatacraft-native-notices
          path: licenses
      - name: Prepare Rust for the bundled AI service
        run: rustup update stable --no-self-update
      - run: python scripts/build_ai.py --test
      - run: Rscript --vanilla scripts/install.R
      - name: Exercise the bundled AI bridge without a real provider
        shell: pwsh
        run: |
          python scripts/build_ai.py
          $helper = Get-ChildItem artifacts/ai-helper -Recurse -Filter rdatacraft-ai.exe | Select-Object -First 1
          python tests/ai_bridge.py --helper $helper.FullName
      - name: Check source tools (full R suite runs after installation)
        run: python scripts/test.py --require-node --source-tools-only
      - run: Rscript --vanilla scripts/collect_licenses.R
      - run: python scripts/fetch_sources.py
      - run: python scripts/fetch_native_sources.py
      - name: Build the self-contained Windows desktop host
        shell: pwsh
        run: |
          $sdk = (Get-Content config/windows-components.json -Raw | ConvertFrom-Json).dotnet_sdk
          Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile artifacts/dotnet-install.ps1
          & pwsh.exe -NoProfile -NonInteractive -File artifacts/dotnet-install.ps1 -Version $sdk -InstallDir "$PWD/artifacts/release-tools/dotnet" -NoPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_windows.py --dotnet "$PWD/artifacts/release-tools/dotnet/dotnet.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/fetch_windows_components.py
      - run: python scripts/package_portable.py --native-host artifacts/windows-host
      - name: Probe the packaged Windows runtime
        shell: pwsh
        run: |
          $bundle = Get-ChildItem dist -Directory -Filter '*windows*portable' | Select-Object -First 1
          if (!$bundle) { throw 'Windows bundle was not created.' }
          $env:R_HOME = Join-Path $bundle.FullName 'runtime/R'
          $env:RHOME = $env:R_HOME
          $env:R_LIBS_USER = Join-Path $bundle.FullName 'runtime/library'
          $engine = Join-Path $bundle.FullName 'runtime/R/bin/x64/Rscript.exe'
          if (!(Test-Path $engine)) { $engine = Join-Path $bundle.FullName 'runtime/R/bin/Rscript.exe' }
          & $engine --vanilla -e "stopifnot(grepl('x86_64', R.version[['platform']]), requireNamespace('shiny'), requireNamespace('svglite'), requireNamespace('processx')); cat('Bundled Windows R is ready')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the verified Windows packaging tool
        run: python scripts/fetch_nsis.py
      - name: Build and exercise Windows setup and uninstall
        shell: pwsh
        run: |
          $bundle = Get-ChildItem dist -Directory -Filter '*windows*portable' | Select-Object -First 1
          $nsis = Join-Path $PWD 'artifacts/release-tools/nsis-3.13'
          python scripts/package_installers.py --windows-bundle $bundle.FullName --makensis "$nsis/makensis.exe" --nsis-dir $nsis --webview-installer artifacts/release-tools/webview2/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content config/release.json -Raw | ConvertFrom-Json).version
          ./scripts/test_windows_installer.ps1 -Installer "dist/RDataCraft-$version-windows-x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_assets.py platform --platform windows-x64 --installer "dist/RDataCraft-$version-windows-x64-setup.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdatacraft-release-windows-x64
          path: artifacts/release-ready/windows-x64/*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdatacraft-source-windows-x64
          path: artifacts/release-source-parts/*
          retention-days: 14
          if-no-files-found: error
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdatacraft-validation-windows-x64
          path: |
            artifacts/validation-*.json
            artifacts/v*-*.log
            dependencies.lock.json
            source-manifest.json
            dist/*/artifacts/validation-native-*.json
            artifacts/installed-windows-native/*
            artifacts/windows-installer-audit-*.json
          if-no-files-found: warn
      - name: Upload requested development bundle
        if: github.event_name == 'workflow_dispatch' && inputs.upload_development_bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdatacraft-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*-setup.exe
  draft-release:
    needs: [sources, mac, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rdatacraft-release-*
          path: artifacts/release-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rdatacraft-source-*
          path: artifacts/release-inputs
      - run: python scripts/release_assets.py assemble --inputs artifacts/release-inputs --output dist/release
      - run: python scripts/publish_release.py
      - name: Summary
        run: |
          version=$(python3 -c 'import json; print(json.load(open("config/release.json"))["version"])')
          echo "### RDataCraft v${version} draft prepared" >> "$GITHUB_STEP_SUMMARY"
          echo "All three native installers passed. Review and publish the draft under [Releases](https://github.com/${GITHUB_REPOSITORY}/releases). No additional branch is needed." >> "$GITHUB_STEP_SUMMARY"
