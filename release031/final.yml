name: Publish tested RDataCraft v0.31 preview
on:
  push:
    branches: [release/v0.31-publication]
permissions:
  contents: read
  actions: read
concurrency:
  group: rdatacraft-publish-v031
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y lzip
      - run: rustup update stable --no-self-update
      - run: python release031/assemble.py collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v031-source-assets
          path: |
            release-material/RDataCraft-0.31-sources.tar.gz
            release-material/RDataCraft-0.31-sources.tar.gz.sha256
            release-material/THIRD-PARTY-NOTICES.txt
            release-material/SOURCE-ACCESS.txt
          retention-days: 2
          if-no-files-found: error
  mac:
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact tested installer and source notices
        run: |
          python3 release031/assemble.py artifact 40152512569 v031-tested-macos-${{ matrix.arch }} original
          python3 release031/assemble.py artifact ${{ github.run_id }} v031-source-assets release-inputs
      - run: python3 release031/repack_mac.py ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v031-final-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.dmg.validation.json
            artifacts/final-installed-mac/**/*.json
          retention-days: 2
          if-no-files-found: error
  windows:
    needs: sources
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact tested installer and source notices
        run: |
          python release031/assemble.py artifact 40151056721 rdatacraft-windows-x64-native-development original
          python release031/assemble.py artifact ${{ github.run_id }} v031-source-assets release-inputs
      - run: python release031/repack_windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v031-final-windows
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.sha256
            dist/*-setup.exe.validation.json
            artifacts/validation-installed-windows-0.31.json
            artifacts/validation-windows-installer-0.31.json
          retention-days: 2
          if-no-files-found: error
  publish:
    needs: [sources, mac, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python release031/publish.py
